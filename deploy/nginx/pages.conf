# Serves published pages. MCP is not on this port; compose publishes it
# directly from the app container.
# Pages:  <PAGEHOST_BASE_URL>/p/<id>/
# Assets: <PAGEHOST_BASE_URL>/_assets/pagehost.css
#
# The sites volume is mounted read-only at /srv/pages.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # allow 10.0.0.0/8;  deny all;      # restrict to the VPC / VPN in production

    location ^~ /_assets/ {
        alias /srv/pages/_assets/;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/pagehost-security.conf;
    }

    # /p/<id>, /p/<id>/, and /p/<id>/index.html. current/ is a symlink to the live version.
    # rewrite stays in this location so the security headers apply to the file it serves.
    # Copy the capture before rewrite: rewrite replaces $1.
    location ~ '^/p/([a-z0-9][a-z0-9-]{2,62})(?:/(?:index\.html)?)?$' {
        include /etc/nginx/snippets/pagehost-security.conf;
        add_header Cache-Control "no-cache" always;
        set $page_id $1;
        root /srv/pages/$page_id/current;
        rewrite ^ /index.html break;
    }
}
