[project]
name = "pagehost"
version = "0.1.0"
description = "Publish and edit HTML pages through MCP tools."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "acceptance: apply a list of page operations and compare semantic HTML",
]
